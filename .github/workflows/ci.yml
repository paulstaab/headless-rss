name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '15 3 * * 0'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.86.0
        components: rustfmt, clippy
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: Check formatting
      working-directory: rust
      run: cargo fmt --all -- --check
    - name: Lint with clippy
      working-directory: rust
      run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.86.0
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: Run Rust tests
      working-directory: rust
      run: cargo test --all-targets --all-features

  release:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # if: github.ref == 'refs/heads/main' # ToDo: restrict releases to main branch before merge
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}:alpha # ToDo: revert to latest before merge
        # Temporarily disable ARM builds.
        # platforms: linux/amd64,linux/arm64. # ToDo: re-enable ARM builds before merge
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max
